# Pipeline: Secret Rotation Check (Scheduled)
# Runs daily to check for expiring secrets and rotate them

trigger: none  # No CI trigger

# Run every day at 9 AM UTC
schedules:
  - cron: "0 9 * * *"
    displayName: 'Daily Secret Expiration Check'
    branches:
      include:
        - main
    always: true  # Run even if no code changes

variables:
  # Key Vault names per environment
  keyVaultDev: 'kv-medsecure-dev'
  keyVaultStaging: 'kv-medsecure-staging'
  keyVaultProd: 'kv-medsecure-prod'

  # Rotation settings
  rotationThresholdDays: 30  # Check secrets expiring within 30 days
  validityDays: 90  # New secrets valid for 90 days

stages:
  # ============================================
  # STAGE 1: Check DEV Environment
  # ============================================
  - stage: CheckDev
    displayName: 'Check DEV Secrets'
    jobs:
      - job: CheckDevSecrets
        displayName: 'Check Development Key Vault'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - template: templates/security/keyvault-rotation.yml
            parameters:
              keyVaultName: '$(keyVaultDev)'
              rotationThresholdDays: $(rotationThresholdDays)
              validityDays: $(validityDays)
              checkOnly: false  # Auto-rotate in DEV
              azureSubscription: '$(AZURE_SERVICE_CONNECTION)'

  # ============================================
  # STAGE 2: Check STAGING Environment
  # ============================================
  - stage: CheckStaging
    displayName: 'Check STAGING Secrets'
    dependsOn: CheckDev
    jobs:
      - job: CheckStagingSecrets
        displayName: 'Check Staging Key Vault'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - template: templates/security/keyvault-rotation.yml
            parameters:
              keyVaultName: '$(keyVaultStaging)'
              rotationThresholdDays: $(rotationThresholdDays)
              validityDays: $(validityDays)
              checkOnly: true  # Only check in STAGING (manual approval required)
              azureSubscription: '$(AZURE_SERVICE_CONNECTION)'

  # ============================================
  # STAGE 3: Check PRODUCTION Environment
  # ============================================
  - stage: CheckProduction
    displayName: 'Check PRODUCTION Secrets'
    dependsOn: CheckStaging
    jobs:
      - job: CheckProductionSecrets
        displayName: 'Check Production Key Vault'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - template: templates/security/keyvault-rotation.yml
            parameters:
              keyVaultName: '$(keyVaultProd)'
              rotationThresholdDays: $(rotationThresholdDays)
              validityDays: $(validityDays)
              checkOnly: true  # Only check in PRODUCTION (manual approval required)
              azureSubscription: '$(AZURE_SERVICE_CONNECTION)'

  # ============================================
  # STAGE 4: Manual Rotation (STAGING)
  # ============================================
  - stage: RotateStaging
    displayName: 'Rotate STAGING Secrets'
    dependsOn: CheckStaging
    condition: and(succeeded(), eq(variables['StagingExpiringSecretsCount'], '0'))  # Only if secrets expiring
    jobs:
      - deployment: RotateStagingSecrets
        displayName: 'Rotate Staging Secrets (Manual Approval)'
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'keyvault-rotation-staging'  # Manual approval required
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - template: templates/security/keyvault-rotation.yml
                  parameters:
                    keyVaultName: '$(keyVaultStaging)'
                    rotationThresholdDays: $(rotationThresholdDays)
                    validityDays: $(validityDays)
                    checkOnly: false  # Actually rotate
                    azureSubscription: '$(AZURE_SERVICE_CONNECTION)'

  # ============================================
  # STAGE 5: Manual Rotation (PRODUCTION)
  # ============================================
  - stage: RotateProduction
    displayName: 'Rotate PRODUCTION Secrets'
    dependsOn: CheckProduction
    condition: and(succeeded(), eq(variables['ProductionExpiringSecretsCount'], '0'))  # Only if secrets expiring
    jobs:
      - deployment: RotateProductionSecrets
        displayName: 'Rotate Production Secrets (Manual Approval)'
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'keyvault-rotation-production'  # Manual approval required (2 approvers)
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - template: templates/security/keyvault-rotation.yml
                  parameters:
                    keyVaultName: '$(keyVaultProd)'
                    rotationThresholdDays: $(rotationThresholdDays)
                    validityDays: $(validityDays)
                    checkOnly: false  # Actually rotate
                    azureSubscription: '$(AZURE_SERVICE_CONNECTION)'

  # ============================================
  # STAGE 6: Summary Report
  # ============================================
  - stage: Summary
    displayName: 'Generate Summary Report'
    dependsOn:
      - CheckDev
      - CheckStaging
      - CheckProduction
    condition: always()
    jobs:
      - job: GenerateSummary
        displayName: 'Generate Summary Report'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - script: |
              #!/bin/bash

              echo ""
              echo "═══════════════════════════════════════════════════════════"
              echo " 📊 Secret Rotation Summary Report"
              echo "═══════════════════════════════════════════════════════════"
              echo ""
              echo "Date: $(date -u +%Y-%m-%d)"
              echo "Build: $(Build.BuildNumber)"
              echo ""
              echo "Environment Summary:"
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo ""
              echo "🔵 DEV Environment"
              echo "   Key Vault: $(keyVaultDev)"
              echo "   Strategy: Auto-rotate"
              echo "   Status: Check pipeline logs for details"
              echo ""
              echo "🟡 STAGING Environment"
              echo "   Key Vault: $(keyVaultStaging)"
              echo "   Strategy: Manual approval required"
              echo "   Status: Check pipeline logs for details"
              echo ""
              echo "🔴 PRODUCTION Environment"
              echo "   Key Vault: $(keyVaultProd)"
              echo "   Strategy: Manual approval required (2 approvers)"
              echo "   Status: Check pipeline logs for details"
              echo ""
              echo "═══════════════════════════════════════════════════════════"
              echo ""
              echo "HDS Compliance:"
              echo "  ✅ Daily automated checks"
              echo "  ✅ 30-day notification threshold"
              echo "  ✅ 90-day secret validity"
              echo "  ✅ Audit trail generated"
              echo "  ✅ Manual approval for STAGING/PROD"
              echo ""
              echo "Next Steps:"
              echo "  1. Review artifact 'KeyVault-Rotation-Reports'"
              echo "  2. Check for Work Items created for expiring secrets"
              echo "  3. Approve manual rotations if needed"
              echo ""
              echo "═══════════════════════════════════════════════════════════"
              echo ""
            displayName: 'Display Summary'

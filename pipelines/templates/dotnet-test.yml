# Template: .NET Tests avec Code Coverage
# Usage: tests unitaires + intégration + coverage > 80%

parameters:
  - name: buildConfiguration
    type: string
    default: 'Release'

  - name: coverageThreshold
    type: number
    default: 80

  - name: testProjects
    type: string
    default: '**/*Tests/*.csproj'

  - name: collectCoverage
    type: boolean
    default: true

steps:
  # ============================================
  # UNIT TESTS
  # ============================================
  - task: DotNetCoreCLI@2
    displayName: 'Run Unit Tests'
    inputs:
      command: 'test'
      projects: 'tests/UnitTests/*.csproj'
      arguments: >
        --configuration ${{ parameters.buildConfiguration }}
        --no-build
        --logger trx
        --logger "console;verbosity=detailed"
        --results-directory $(Agent.TempDirectory)/TestResults/UnitTests
        /p:CollectCoverage=${{ parameters.collectCoverage }}
        /p:CoverletOutputFormat=cobertura
        /p:CoverletOutput=$(Agent.TempDirectory)/Coverage/unit-coverage.xml
        /p:Exclude="[*]*.Migrations.*"
      publishTestResults: false

  # ============================================
  # INTEGRATION TESTS
  # ============================================
  - task: DotNetCoreCLI@2
    displayName: 'Run Integration Tests'
    inputs:
      command: 'test'
      projects: 'tests/IntegrationTests/*.csproj'
      arguments: >
        --configuration ${{ parameters.buildConfiguration }}
        --no-build
        --logger trx
        --logger "console;verbosity=detailed"
        --results-directory $(Agent.TempDirectory)/TestResults/IntegrationTests
        /p:CollectCoverage=${{ parameters.collectCoverage }}
        /p:CoverletOutputFormat=cobertura
        /p:CoverletOutput=$(Agent.TempDirectory)/Coverage/integration-coverage.xml
        /p:Exclude="[*]*.Migrations.*"
      publishTestResults: false

  # ============================================
  # FUNCTIONAL TESTS
  # ============================================
  - task: DotNetCoreCLI@2
    displayName: 'Run Functional Tests'
    inputs:
      command: 'test'
      projects: 'tests/FunctionalTests/*.csproj'
      arguments: >
        --configuration ${{ parameters.buildConfiguration }}
        --no-build
        --logger trx
        --logger "console;verbosity=detailed"
        --results-directory $(Agent.TempDirectory)/TestResults/FunctionalTests
      publishTestResults: false
    continueOnError: true

  # ============================================
  # PUBLISH TEST RESULTS
  # ============================================
  - task: PublishTestResults@2
    displayName: 'Publish Test Results'
    condition: always()
    inputs:
      testResultsFormat: 'VSTest'
      testResultsFiles: '$(Agent.TempDirectory)/TestResults/**/*.trx'
      mergeTestResults: true
      failTaskOnFailedTests: true
      testRunTitle: 'MedSecure Tests - $(Build.BuildNumber)'

  # ============================================
  # CODE COVERAGE REPORT
  # ============================================
  - ${{ if eq(parameters.collectCoverage, true) }}:
      - task: PublishCodeCoverageResults@2
        displayName: 'Publish Code Coverage'
        inputs:
          codeCoverageTool: 'Cobertura'
          summaryFileLocation: '$(Agent.TempDirectory)/Coverage/*.xml'
          reportDirectory: '$(Agent.TempDirectory)/Coverage/Reports'
          failIfCoverageEmpty: true

      # Install ReportGenerator tool
      - task: DotNetCoreCLI@2
        displayName: 'Install ReportGenerator'
        inputs:
          command: 'custom'
          custom: 'tool'
          arguments: 'install --global dotnet-reportgenerator-globaltool'

      # Generate HTML coverage report
      - script: |
          reportgenerator \
            -reports:$(Agent.TempDirectory)/Coverage/*.xml \
            -targetdir:$(Agent.TempDirectory)/Coverage/Reports \
            -reporttypes:HtmlInline_AzurePipelines;Cobertura;Badges \
            -verbosity:Info
        displayName: 'Generate Coverage Report'

      # Check coverage threshold
      - script: |
          #!/bin/bash
          set -e

          COVERAGE_FILE="$(Agent.TempDirectory)/Coverage/unit-coverage.xml"

          if [ ! -f "$COVERAGE_FILE" ]; then
            echo "❌ Coverage file not found: $COVERAGE_FILE"
            exit 1
          fi

          # Extract line coverage percentage
          COVERAGE=$(grep -oP 'line-rate="\K[0-9.]+' "$COVERAGE_FILE" | head -1)
          COVERAGE_PERCENT=$(echo "$COVERAGE * 100" | bc)
          COVERAGE_INT=${COVERAGE_PERCENT%.*}

          echo "📊 Code Coverage: ${COVERAGE_INT}%"
          echo "🎯 Threshold: ${{ parameters.coverageThreshold }}%"

          if [ "$COVERAGE_INT" -lt "${{ parameters.coverageThreshold }}" ]; then
            echo "❌ Code coverage ${COVERAGE_INT}% is below threshold ${{ parameters.coverageThreshold }}%"
            exit 1
          else
            echo "✅ Code coverage ${COVERAGE_INT}% meets threshold"
          fi
        displayName: 'Verify Coverage Threshold'
        condition: succeededOrFailed()

  # ============================================
  # PUBLISH COVERAGE ARTIFACTS
  # ============================================
  - task: PublishBuildArtifacts@1
    displayName: 'Publish Coverage Reports'
    condition: always()
    inputs:
      PathtoPublish: '$(Agent.TempDirectory)/Coverage/Reports'
      ArtifactName: 'CodeCoverage'
      publishLocation: 'Container'

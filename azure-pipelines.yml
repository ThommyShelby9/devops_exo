# MedSecure - Pipeline CI/CD
# Trigger sur toutes les branches pour validation
# Production deployment nécessite validation manuelle

trigger:
  branches:
    include:
      - main
      - develop
      - feature/*
      - hotfix/*
  paths:
    exclude:
      - docs/**
      - README.md
      - .gitignore

pr:
  branches:
    include:
      - main
      - develop
  paths:
    exclude:
      - docs/**
      - README.md

variables:
  # Build Configuration
  buildConfiguration: 'Release'
  dotnetSdkVersion: '8.x'

  # Code Coverage
  coverageThreshold: 80

  # Versioning
  majorVersion: 1
  minorVersion: 0
  patchVersion: $[counter(format('{0}.{1}', variables['majorVersion'], variables['minorVersion']), 0)]
  buildVersion: '$(majorVersion).$(minorVersion).$(patchVersion)'

  # Artifacts
  artifactName: 'medsecure-drop'

  # Disable telemetry
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

stages:
  # ============================================
  # STAGE 1: BUILD & TEST
  # ============================================
  - stage: Build
    displayName: 'Build & Test'
    jobs:
      - job: BuildBackend
        displayName: 'Build .NET 8 Backend'
        pool:
          vmImage: 'ubuntu-latest'

        steps:
          - task: UseDotNet@2
            displayName: 'Install .NET SDK $(dotnetSdkVersion)'
            inputs:
              version: '$(dotnetSdkVersion)'
              includePreviewVersions: false

          - task: DotNetCoreCLI@2
            displayName: 'Restore NuGet packages'
            inputs:
              command: 'restore'
              projects: '**/*.csproj'
              feedsToUse: 'select'
              verbosityRestore: 'Minimal'

          - task: DotNetCoreCLI@2
            displayName: 'Build solution'
            inputs:
              command: 'build'
              projects: '**/*.sln'
              arguments: '--configuration $(buildConfiguration) --no-restore /p:Version=$(buildVersion)'

          - template: pipelines/templates/dotnet-test.yml
            parameters:
              buildConfiguration: '$(buildConfiguration)'
              coverageThreshold: 80

          - task: DotNetCoreCLI@2
            displayName: 'Publish Web API'
            inputs:
              command: 'publish'
              publishWebProjects: true
              arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/web --no-build /p:Version=$(buildVersion)'
              zipAfterPublish: true
              modifyOutputPath: true

          - task: PublishBuildArtifacts@1
            displayName: 'Publish artifacts'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: '$(artifactName)'
              publishLocation: 'Container'

          - task: PublishBuildArtifacts@1
            displayName: 'Publish Bicep templates'
            inputs:
              PathtoPublish: '$(Build.SourcesDirectory)/infra'
              ArtifactName: 'infra'
              publishLocation: 'Container'

  # ============================================
  # STAGE 2: SECURITY SCANNING (DevSecOps)
  # ============================================
  - stage: SecurityScanning
    displayName: 'Security Scanning'
    dependsOn: []  # Run in parallel with Build
    jobs:
      # SAST - Static Application Security Testing
      - job: SonarCloud
        displayName: 'SonarCloud SAST'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - template: pipelines/templates/security/sonarcloud.yml
            parameters:
              sonarOrganization: '$(SONAR_ORGANIZATION)'
              sonarProjectKey: '$(SONAR_PROJECT_KEY)'
              buildConfiguration: '$(buildConfiguration)'
              failOnQualityGate: true

      # Secret Detection
      - job: Gitleaks
        displayName: 'Gitleaks Secret Scan'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - template: pipelines/templates/security/gitleaks.yml
            parameters:
              failOnSecrets: true
              configFile: '.gitleaks.toml'

      # SCA - Software Composition Analysis
      - job: Snyk
        displayName: 'Snyk Dependency Scan'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - template: pipelines/templates/security/snyk.yml
            parameters:
              severityThreshold: 'high'
              failOnVulnerabilities: true
              monitorProject: true

      # OWASP Dependency Check
      - job: OWASP
        displayName: 'OWASP Dependency Check'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - template: pipelines/templates/security/owasp-dependency-check.yml
            parameters:
              scanPath: '.'
              cvssThreshold: 7
              failOnCvss: true

  # ============================================
  # STAGE 3: BUILD DOCKER IMAGE
  # ============================================
  - stage: Docker
    displayName: 'Docker Build & Scan'
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: BuildImage
        displayName: 'Build & Push Docker Image'
        pool:
          vmImage: 'ubuntu-latest'

        variables:
          imageName: 'medsecure/web'
          imageTag: '$(Build.BuildId)'

        steps:
          - task: Docker@2
            displayName: 'Build Docker image'
            inputs:
              command: 'build'
              repository: '$(imageName)'
              dockerfile: 'src/Web/Dockerfile'
              tags: |
                $(imageTag)
                latest
              arguments: '--build-arg BUILD_VERSION=$(buildVersion)'

          # Container Image Security Scan
          - template: pipelines/templates/security/trivy.yml
            parameters:
              imageName: '$(imageName)'
              imageTag: '$(imageTag)'
              severityLevels: 'CRITICAL,HIGH'
              failOnVulnerabilities: true
              scanType: 'image'

          - task: Docker@2
            displayName: 'Push to Azure Container Registry'
            condition: succeeded()
            inputs:
              command: 'push'
              containerRegistry: '$(ACR_SERVICE_CONNECTION)'
              repository: '$(imageName)'
              tags: |
                $(imageTag)
                latest

  # ============================================
  # STAGE 4: DEPLOY TO DEV (Auto)
  # ============================================
  - stage: DeployDev
    displayName: 'Deploy to DEV'
    dependsOn:
      - Build
      - Docker
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'))
    jobs:
      - deployment: DeployDevEnvironment
        displayName: 'Deploy to Development'
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'medsecure-dev'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: '$(artifactName)'

                - template: pipelines/templates/deployment/blue-green-deploy.yml
                  parameters:
                    azureSubscription: '$(AZURE_SERVICE_CONNECTION)'
                    resourceGroupName: '$(RESOURCE_GROUP_DEV)'
                    appServiceName: '$(APP_SERVICE_NAME_DEV)'
                    slotName: 'staging'
                    packagePath: '$(Pipeline.Workspace)/$(artifactName)/**/*.zip'
                    enableAutoSwap: true  # Auto-swap for DEV
                    swapWithPreview: false  # Direct swap for DEV
                    rollbackOnFailure: true

  # ============================================
  # STAGE 5: DEPLOY TO STAGING (Manual Approval)
  # ============================================
  - stage: DeployStaging
    displayName: 'Deploy to STAGING'
    dependsOn:
      - Build
      - Docker
      - SecurityScanning
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployStagingEnvironment
        displayName: 'Deploy to Staging'
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'medsecure-staging'  # Manual approval configured here
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: '$(artifactName)'

                - template: pipelines/templates/deployment/blue-green-deploy.yml
                  parameters:
                    azureSubscription: '$(AZURE_SERVICE_CONNECTION)'
                    resourceGroupName: '$(RESOURCE_GROUP_STAGING)'
                    appServiceName: '$(APP_SERVICE_NAME_STAGING)'
                    slotName: 'staging'
                    packagePath: '$(Pipeline.Workspace)/$(artifactName)/**/*.zip'
                    enableAutoSwap: false  # Manual approval required
                    swapWithPreview: true  # Use swap with preview for validation
                    rollbackOnFailure: true

  # ============================================
  # STAGE 6: DEPLOY TO PRODUCTION (Manual Approval)
  # ============================================
  - stage: DeployProduction
    displayName: 'Deploy to PRODUCTION'
    dependsOn: DeployStaging
    condition: succeeded()
    jobs:
      - deployment: DeployProductionEnvironment
        displayName: 'Deploy to Production'
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'medsecure-production'  # Manual approval configured here
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: '$(artifactName)'

                - template: pipelines/templates/deployment/blue-green-deploy.yml
                  parameters:
                    azureSubscription: '$(AZURE_SERVICE_CONNECTION)'
                    resourceGroupName: '$(RESOURCE_GROUP_PROD)'
                    appServiceName: '$(APP_SERVICE_NAME_PROD)'
                    slotName: 'staging'
                    packagePath: '$(Pipeline.Workspace)/$(artifactName)/**/*.zip'
                    enableAutoSwap: false  # Manual approval required (HDS compliance)
                    swapWithPreview: true  # Use swap with preview for maximum safety
                    rollbackOnFailure: true
                    smokeTestTimeout: 300  # 5 minutes for production validation
